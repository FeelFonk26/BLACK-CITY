name: Deploy BLACK CITY API to dedicated VPS

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "database/migrations/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-city-platform-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        id: validate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_ENV: ${{ secrets.VPS_APP_ENV }}
        run: |
          set -eu
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_APP_ENV" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS deployment skipped; configure VPS_HOST, VPS_USER, VPS_SSH_KEY, and VPS_APP_ENV when the dedicated VPS is ready."
            exit 0
          fi
          required_keys="POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD JWT_SECRET CORS_ORIGINS"
          for key in $required_keys; do
            if ! printf '%s\\n' "$VPS_APP_ENV" | grep -Eq "^${key}=.+$"; then
              echo "::error::VPS_APP_ENV is missing a required non-empty key: $key"
              exit 1
            fi
          done
          if ! printf '%s\\n' "$VPS_APP_ENV" | awk -F= '/^JWT_SECRET=/ { sub(/^[^=]*=/, ""); if (length($0) >= 32) valid=1 } END { exit !valid }'; then
            echo "::error::JWT_SECRET in VPS_APP_ENV must be at least 32 characters."
            exit 1
          fi
          if ! printf '%s\\n' "$VPS_APP_ENV" | awk -F= '/^POSTGRES_PASSWORD=/ { sub(/^[^=]*=/, ""); if ($0 ~ /^[A-Za-z0-9_-]+$/) valid=1 } END { exit !valid }'; then
            echo "::error::POSTGRES_PASSWORD must use only letters, digits, underscore, or hyphen because it is embedded in DATABASE_URL."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.validate.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/black-city-platform
          chmod 600 ~/.ssh/black-city-platform
          PORT="${VPS_SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host black-city-platform"
            echo "  HostName $VPS_HOST"
            echo "  User ${{ secrets.VPS_USER }}"
            echo "  Port $PORT"
            echo "  IdentityFile ~/.ssh/black-city-platform"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >> ~/.ssh/config

      - name: Verify dedicated VPS deployment prerequisites
        if: steps.validate.outputs.ready == 'true'
        run: |
          set -eu
          ssh black-city-platform 'set -eu
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed on this VPS. Install Docker Engine and the Compose plugin before retrying."
              exit 2
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin is unavailable for this SSH user."
              exit 2
            fi
            APP_DIR=/opt/black-city-platform
            if [ -e "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ] && [ -n "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              echo "$APP_DIR exists and is not a Git checkout; refusing to overwrite existing files."
              exit 3
            fi
            if [ -d "$APP_DIR/.git" ] && [ -n "$(git -C "$APP_DIR" status --porcelain)" ]; then
              echo "$APP_DIR has local changes; refusing to overwrite them."
              exit 3
            fi
          '

      - name: Transfer private environment file securely
        if: steps.validate.outputs.ready == 'true'
        env:
          VPS_APP_ENV: ${{ secrets.VPS_APP_ENV }}
        run: |
          set -eu
          printf '%s' "$VPS_APP_ENV" | ssh black-city-platform 'umask 077; cat > /tmp/black-city-platform.env'

      - name: Deploy isolated platform services
        if: steps.validate.outputs.ready == 'true'
        run: |
          ssh black-city-platform 'set -eu
            trap "rm -f /tmp/black-city-platform.env" EXIT
            APP_DIR=/opt/black-city-platform
            if [ ! -f /tmp/black-city-platform.env ]; then
              echo "Temporary deployment environment file is missing."
              exit 4
            fi
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch main https://github.com/FeelFonk26/BLACK-CITY.git "$APP_DIR"
            else
              git -C "$APP_DIR" fetch origin main
              git -C "$APP_DIR" checkout main
              git -C "$APP_DIR" pull --ff-only origin main
            fi
            install -m 600 /tmp/black-city-platform.env "$APP_DIR/.env"
            cd "$APP_DIR"
            docker compose up -d --build
            docker compose ps
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:4000/health; then exit 0; fi
              sleep 2
            done
            docker compose logs --tail=100 api
            exit 1
          '
